    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <!-- OneSignal Push -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        OneSignalDeferred.push(async function(OneSignal) {
            await OneSignal.init({
                appId: "e830a2aa-bb9b-489f-95d1-c65d4119e511",
            });
        });
    </script>

    <!-- OneSignal Subscribe Button (Fallback) -->
<button id="onesignal-subscribe" style="display:none;background:#25d366;color:white;padding:12px 24px;border:none;border-radius:12px;font-size:16px;cursor:pointer;">
    🔔 Enable Notifications
</button>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Check if OneSignal is available
        if (window.OneSignalDeferred) {
            window.OneSignalDeferred.push(async function(OneSignal) {
                // Check if notifications are already enabled
                const isSubscribed = await OneSignal.isPushNotificationsEnabled();
                
                if (!isSubscribed) {
                    // Show subscribe button
                    const btn = document.getElementById('onesignal-subscribe');
                    btn.style.display = 'block';
                    btn.onclick = async function() {
                        try {
                            await OneSignal.registerForPushNotifications();
                            btn.textContent = '✅ Subscribed!';
                            btn.style.background = '#4caf50';
                        } catch(e) {
                            alert('Failed to enable notifications: ' + e.message);
                        }
                    };
                }
            });
        }
    });
</script>

                max-height: 900px;
            }
        }

        @media (max-width: 380px) {
            .chat-header .info .name {
                font-size: 13px;
            }
            .chat-header .header-actions button {
                font-size: 16px;
            }
            .message .msg-text {
                font-size: 13px;
            }
            .input-area .message-input {
                font-size: 14px;
                padding: 6px 12px;
            }
            .input-area .send-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Login Screen -->
        <div class="login-screen" id="loginScreen">
            <div class="logo">💬</div>
            <h2>Chat with Support</h2>
            <p>Enter your username to start chatting</p>
            <div class="error" id="loginError">Please enter a valid username</div>
            <input type="text" id="usernameInput" placeholder="Username" maxlength="20" autocomplete="off">
            <button class="btn-primary" onclick="login()">Start Chatting</button>
        </div>

        <!-- Chat Interface -->
        <div class="chat-interface" id="chatInterface">
            <div class="chat-header">
    <div class="avatar" onclick="openProfile()" style="width:44px;height:44px;min-width:44px;">
        <img src="https://i.postimg.cc/1Rgpzyy3/ig.png" alt="Admin Support">
    </div>
    <div class="info" onclick="openProfile()">
        <div class="name" style="font-size:16px;">Admin Support</div>
        <div class="status" id="onlineStatus" style="font-size:12px;">Online</div>
    </div>
    <div class="header-actions" style="padding:4px 0;">
        <button onclick="logout()" title="Logout" style="font-size:22px;padding:8px 12px;">✕</button>
    </div>
</div>

            <!-- Messages -->
            <div class="messages-container" id="messagesContainer">
                <div class="loading-messages">Loading messages...</div>
            </div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <span></span><span></span><span></span>
            </div>

            <!-- Image Preview -->
            <div class="image-preview" id="imagePreview">
                <img id="previewImage" src="" alt="Preview">
                <span style="color:#8898aa;font-size:12px;flex:1;" id="previewFileName">image.jpg</span>
                <button class="remove-image" onclick="removeImage()">✕</button>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
                <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)">
                <textarea class="message-input" id="messageInput" rows="1" placeholder="Type a message..." onkeydown="handleEnter(event)" oninput="autoResize(this)"></textarea>
                <button class="emoji-btn" onclick="toggleEmoji()">😊</button>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <!-- Image Viewer -->
    <div class="image-viewer" id="imageViewer">
        <button class="close-viewer" onclick="closeImageViewer()">✕</button>
        <img id="viewerImage" src="">
    </div>

    <!-- Profile Modal -->
    <div class="profile-overlay" id="profileOverlay" onclick="closeProfile()">
        <div class="profile-modal" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeProfile()">✕</button>
            
            <div class="profile-image">
                <img src="https://i.postimg.cc/VNzQSFZk/JPEG-20260506-131740-5426928668260112033.jpg" alt="Admin Support">
            </div>
            
            <div class="profile-name">Admin Support</div>
            <div class="profile-username">@wolftz_official</div>
            <div class="profile-bio">Chat support • Available 24/7</div>
            
            <hr class="divider">
            
            <div class="links">
                <a href="https://whatsapp.com/channel/0029Vb7IqmWKAwEcKWU4Xv29" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-whatsapp"></i>
                    WhatsApp Channel
                    <span class="arrow">→</span>
                </a>
                <a href="https://t.me/wolftz" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-telegram-plane"></i>
                    Telegram Channel
                    <span class="arrow">→</span>
                </a>
            </div>
            
            <hr class="divider">
        </div>
    </div>

    <!-- Custom Confirm Dialog -->
    <div class="custom-confirm-overlay" id="customConfirm">
        <div class="custom-confirm">
            <div class="icon" id="confirmIcon">⚠️</div>
            <h3 id="confirmTitle">Are you sure?</h3>
            <p id="confirmMessage">This action cannot be undone.</p>
            <div class="actions">
                <button class="cancel-btn" onclick="closeCustomConfirm()">Cancel</button>
                <button class="confirm-btn" id="confirmActionBtn" onclick="executeCustomConfirm()">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyAUm-NXPXO_qsu2PnSNTPsdsWARBG1YDa8",
            authDomain: "admin-assisant-wolftz.firebaseapp.com",
            databaseURL: "https://admin-assisant-wolftz-default-rtdb.firebaseio.com",
            projectId: "admin-assisant-wolftz",
            storageBucket: "admin-assisant-wolftz.firebasestorage.app",
            messagingSenderId: "555076040888",
            appId: "1:555076040888:web:bc051a17b3b4f7ccbd5c4d",
            measurementId: "G-CD5GY75WLT"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let currentUserId = null;
        let selectedImage = null;
        let messageListener = null;
        let currentUsername = '';

        // ============================================================
        // PUSH NOTIFICATIONS SETUP
        // ============================================================
        function setupPushNotifications(userId) {
            if (window.OneSignalDeferred) {
                window.OneSignalDeferred.push(async function(OneSignal) {
                    await OneSignal.login(userId);
                    console.log('🔔 Push notifications enabled for user:', userId);
                });
            }
        }

        // ============================================================
        // LOGIN
        // ============================================================
        function login() {
            const username = document.getElementById('usernameInput').value.trim();
            const error = document.getElementById('loginError');

            if (!username || username.length < 2) {
                error.classList.add('show');
                error.textContent = 'Please enter a valid username (min 2 characters)';
                return;
            }

            error.classList.remove('show');
            
            database.ref('users').orderByChild('username').equalTo(username).once('value', function(snapshot) {
                const users = snapshot.val();
                
                if (users) {
                    const userId = Object.keys(users)[0];
                    currentUserId = userId;
                    currentUser = users[userId];
                    currentUsername = username;
                } else {
                    currentUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                    currentUser = { username: username };
                    currentUsername = username;
                    database.ref('users/' + currentUserId).set({
                        username: username,
                        createdAt: new Date().toISOString()
                    });
                }

                localStorage.setItem('chatUserId', currentUserId);
                localStorage.setItem('chatUsername', username);

                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('chatInterface').classList.add('active');
                
                loadMessages();
                setupMessageListener();
                updateOnlineStatus();
                
                // Setup push notifications
                setupPushNotifications(currentUserId);
            });
        }

        // ============================================================
        // LOAD MESSAGES
        // ============================================================
        function loadMessages() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div class="loading-messages">Loading messages...</div>';

            if (!currentUserId) {
                console.log('No user ID, waiting for login');
                return;
            }

            database.ref('users/' + currentUserId + '/notifications').once('value', function(snapshot) {
                const notifications = snapshot.val();
                container.innerHTML = '';
                
                if (!notifications) {
                    showEmptyState();
                    return;
                }

                const messages = Object.entries(notifications);
                if (messages.length === 0) {
                    showEmptyState();
                    return;
                }

                messages.sort(function(a, b) {
                    const timeA = new Date(a[1].timestamp || 0);
                    const timeB = new Date(b[1].timestamp || 0);
                    return timeA - timeB;
                });

                let lastDate = '';
                messages.forEach(function([key, msg]) {
                    const date = new Date(msg.timestamp || Date.now());
                    const dateStr = date.toLocaleDateString('en-US', { 
                        weekday: 'long', 
                        year: 'numeric', 
                        month: 'long', 
                        day: 'numeric' 
                    });

                    if (dateStr !== lastDate) {
                        lastDate = dateStr;
                        const divider = document.createElement('div');
                        divider.className = 'date-divider';
                        divider.innerHTML = '<span>' + dateStr + '</span>';
                        container.appendChild(divider);
                    }

                    const isAdmin = msg.adminMessage !== undefined;
                    
                    const messageEl = document.createElement('div');
                    messageEl.className = 'message ' + (isAdmin ? 'received' : 'sent');
                    messageEl.dataset.msgKey = key;
                    
                    // Long press - only on text, not images or buttons
                    messageEl.addEventListener('mousedown', function(e) {
                        if (e.target.tagName !== 'IMG' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                            handleLongPress(e, key);
                        }
                    });
                    messageEl.addEventListener('mouseup', cancelLongPress);
                    messageEl.addEventListener('mouseleave', cancelLongPress);
                    messageEl.addEventListener('touchstart', function(e) {
                        if (e.target.tagName !== 'IMG' && e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
                            handleLongPress(e, key);
                        }
                    }, { passive: false });
                    messageEl.addEventListener('touchend', cancelLongPress, { passive: false });
                    messageEl.addEventListener('touchmove', cancelLongPress, { passive: false });
                    
                    let content = '';
                    if (msg.imageUrl) {
                        content += '<div class="msg-image-container">' +
                            '<img src="' + msg.imageUrl + '" class="msg-image" onclick="event.stopPropagation();viewImage(\'' + msg.imageUrl + '\')" onerror="this.style.display=\'none\'" alt="Image">' +
                            '<button class="download-btn" onclick="event.stopPropagation();downloadImage(\'' + msg.imageUrl + '\')">⬇ Download</button>' +
                        '</div>';
                    }
                    const displayText = isAdmin ? msg.adminMessage : msg.message;
                    if (displayText) {
                        content += '<div class="msg-text">' + linkify(displayText) + '</div>';
                    }
                    content += '<div class="msg-time">' + date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) + '</div>';
                    
                    messageEl.innerHTML = content;
                    container.appendChild(messageEl);
                });

                scrollToBottom();
            });
        }

        function showEmptyState() {
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#5a6a85;">' +
                '<div style="font-size:48px;margin-bottom:16px;">💬</div>' +
                '<div style="font-size:16px;font-weight:500;">No messages yet</div>' +
                '<div style="font-size:13px;margin-top:6px;">Send a message to start the conversation</div>' +
            '</div>';
        }

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text && !selectedImage) {
                return;
            }

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.innerHTML = '⏳';

            const messageData = {
                timestamp: new Date().toLocaleString(),
                read: false
            };

            if (text) {
                messageData.message = text;
            }

            if (selectedImage) {
                try {
                    const formData = new FormData();
                    formData.append('image', selectedImage);
                    
                    const IMGBB_API_KEY = '5e227c108107599d3c5c45e12eb22bdb';
                    
                    const response = await fetch('https://api.imgbb.com/1/upload?key=' + IMGBB_API_KEY, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        messageData.imageUrl = data.data.url;
                        await database.ref('users/' + currentUserId + '/notifications').push(messageData);
                        
                        input.value = '';
                        input.style.height = 'auto';
                        removeImage();
                        sendBtn.disabled = false;
                        sendBtn.innerHTML = '➤';
                        scrollToBottom();
                    } else {
                        throw new Error(data.error?.message || 'Upload failed');
                    }
                } catch (error) {
                    console.error('Upload error:', error);
                    alert('Error uploading image: ' + error.message);
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '➤';
                }
            } else {
                try {
                    await database.ref('users/' + currentUserId + '/notifications').push(messageData);
                    input.value = '';
                    input.style.height = 'auto';
                    removeImage();
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '➤';
                    scrollToBottom();
                } catch (error) {
                    console.error('Database error:', error);
                    alert('Error sending message: ' + error.message);
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = '➤';
                }
            }
        }

        // ============================================================
        // SETUP MESSAGE LISTENER
        // ============================================================
        function setupMessageListener() {
            if (messageListener) {
                database.ref('users/' + currentUserId + '/notifications').off();
            }

            messageListener = database.ref('users/' + currentUserId + '/notifications');
            messageListener.on('child_added', function() {
                loadMessages();
            });

            database.ref('users/' + currentUserId + '/typing').on('value', function(snapshot) {
                const typing = snapshot.val();
                const indicator = document.getElementById('typingIndicator');
                if (typing) {
                    indicator.classList.add('active');
                } else {
                    indicator.classList.remove('active');
                }
            });
        }

        // ============================================================
        // IMAGE HANDLING
        // ============================================================
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                event.target.value = '';
                return;
            }
            
            if (file.size > 10 * 1024 * 1024) {
                alert('Image size must be less than 10MB');
                event.target.value = '';
                return;
            }
            
            selectedImage = file;
            const preview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImage');
            const previewName = document.getElementById('previewFileName');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                previewImg.src = e.target.result;
                previewName.textContent = file.name;
                preview.classList.add('active');
            };
            reader.onerror = function() {
                alert('Error reading image file');
                selectedImage = null;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function removeImage() {
            selectedImage = null;
            document.getElementById('imagePreview').classList.remove('active');
            document.getElementById('previewImage').src = '';
            document.getElementById('previewFileName').textContent = 'image.jpg';
        }

        // ============================================================
        // IMAGE VIEWER
        // ============================================================
        function viewImage(url) {
            if (!url) return;
            const viewer = document.getElementById('imageViewer');
            const viewerImg = document.getElementById('viewerImage');
            viewerImg.src = url;
            viewer.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeImageViewer() {
            const viewer = document.getElementById('imageViewer');
            viewer.style.display = 'none';
            document.getElementById('viewerImage').src = '';
            document.body.style.overflow = '';
        }

        function downloadImage(url) {
            window.open(url, '_blank');
        }

        // ============================================================
        // UTILITY FUNCTIONS
        // ============================================================
        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            setTimeout(function() {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function updateOnlineStatus() {
            const status = document.getElementById('onlineStatus');
            if (navigator.onLine) {
                status.textContent = 'Online';
                status.style.color = '#25d366';
            } else {
                status.textContent = 'Offline';
                status.style.color = '#ff6b6b';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            showCustomConfirm(
                'Logout?',
                'Are you sure you want to logout?',
                function() {
                    localStorage.removeItem('chatUserId');
                    localStorage.removeItem('chatUsername');
                    document.getElementById('chatInterface').classList.remove('active');
                    document.getElementById('loginScreen').style.display = 'flex';
                    document.getElementById('usernameInput').value = '';
                    if (messageListener) {
                        database.ref('users/' + currentUserId + '/notifications').off();
                        database.ref('users/' + currentUserId + '/typing').off();
                    }
                    currentUserId = null;
                },
                false,
                '👋'
            );
        }

        function toggleEmoji() {
            const emojis = ['😊', '😂', '❤️', '👍', '👋', '🔥', '💯', '✨', '🎉', '💪', '🤝', '🙏'];
            const random = emojis[Math.floor(Math.random() * emojis.length)];
            const input = document.getElementById('messageInput');
            input.value += random;
            input.focus();
        }

        // ============================================================
        // LINKIFY
        // ============================================================
        function linkify(text) {
            if (!text) return '';
            const urlRegex = /(https?:\/\/[^\s]+)|(www\.[^\s]+)/gi;
            return text.replace(urlRegex, function(url) {
                let href = url;
                if (!/^https?:\/\//i.test(url)) {
                    href = 'https://' + url;
                }
                return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" style="color: #bf00ff; text-decoration: underline; word-break: break-all;">' + url + '</a>';
            });
        }

        // ============================================================
        // LONG PRESS DELETE
        // ============================================================
        let longPressTimer = null;

        function handleLongPress(e, msgKey) {
            e.preventDefault();
            
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
            
            longPressTimer = setTimeout(function() {
                confirmDeleteMessage(msgKey);
            }, 600);
        }

        function cancelLongPress() {
            if (longPressTimer) {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            }
        }

        function confirmDeleteMessage(msgKey) {
            if (!currentUserId || !msgKey) {
                console.error('Missing userId or message key');
                showCustomConfirm('Error', 'Cannot delete: missing user or message', null, false, '❌');
                return;
            }
            
            showCustomConfirm(
                'Delete Message?',
                'This message will be permanently removed.',
                function() {
                    const path = 'users/' + currentUserId + '/notifications/' + msgKey;
                    console.log('Deleting message:', msgKey);
                    
                    database.ref(path).remove()
                        .then(function() {
                            console.log('Message deleted successfully');
                            loadMessages();
                        })
                        .catch(function(error) {
                            console.error('Delete error:', error);
                            showCustomConfirm('Error', 'Failed to delete: ' + error.message, null, false, '❌');
                        });
                },
                true,
                '🗑️'
            );
        }

        // ============================================================
        // CUSTOM CONFIRM DIALOG
        // ============================================================
        let confirmCallback = null;

        function showCustomConfirm(title, message, onConfirm, isDanger, icon) {
            isDanger = isDanger || false;
            icon = icon || '⚠️';
            
            const overlay = document.getElementById('customConfirm');
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmIcon').textContent = icon;
            
            const confirmBtn = document.getElementById('confirmActionBtn');
            confirmBtn.className = 'confirm-btn' + (isDanger ? ' danger' : '');
            confirmBtn.textContent = isDanger ? 'Delete' : 'Confirm';
            
            confirmCallback = onConfirm;
            overlay.classList.add('active');
        }

        function closeCustomConfirm() {
            document.getElementById('customConfirm').classList.remove('active');
            confirmCallback = null;
        }

        function executeCustomConfirm() {
            if (confirmCallback) {
                confirmCallback();
            }
            closeCustomConfirm();
        }

        document.addEventListener('click', function(e) {
            const overlay = document.getElementById('customConfirm');
            if (e.target === overlay) {
                closeCustomConfirm();
            }
        });

        // ============================================================
        // PROFILE MODAL
        // ============================================================
        function openProfile() {
            document.getElementById('profileOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeProfile() {
            document.getElementById('profileOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeProfile();
            }
        });

        // ============================================================
        // CHECK EXISTING SESSION
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedUserId = localStorage.getItem('chatUserId');
            const savedUsername = localStorage.getItem('chatUsername');
            if (savedUserId && savedUsername) {
                currentUserId = savedUserId;
                currentUsername = savedUsername;
                database.ref('users/' + savedUserId).once('value', function(snapshot) {
                    if (snapshot.exists()) {
                        currentUser = snapshot.val();
                        document.getElementById('loginScreen').style.display = 'none';
                        document.getElementById('chatInterface').classList.add('active');
                        loadMessages();
                        setupMessageListener();
                        updateOnlineStatus();
                        
                        // Re-setup push notifications
                        setupPushNotifications(currentUserId);
                    }
                });
            }
        });

        console.log('💬 Chat initialized - Admin Support');
    </script>
</body>
</html>
